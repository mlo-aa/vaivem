name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @vaivem/web
      - run: npm test -w @vaivem/web
      - run: npm run build -w @vaivem/web
        env:
          AUTH_SECRET: ci-build-secret
